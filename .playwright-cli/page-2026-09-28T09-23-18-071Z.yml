    - heading "Wat mensen meestal vragen." [level=2] [ref=f2e451]
    - generic [ref=f2e452]:
      - generic [ref=f2e453]:
        - button "Hoe werkt het aanvragen van een afspraak?" [ref=f2e454] [cursor=pointer]
        - generic: Kies hierboven je behandeling, pak een vrij moment in de agenda en vul je gegevens in. Je bevestiging komt meteen per mail binnen — de afspraak staat dan vast. Verzetten of annuleren kan via de link in die mail.
      - generic [ref=f2e456]:
        - button "Wat kost een behandeling?" [ref=f2e457] [cursor=pointer]
        - generic: De prijs hangt af van de behandeling en of het om één sessie of een kuur gaat. Je krijgt het volledige bedrag te horen tijdens de intake, vóórdat er iets gebeurt — nooit achteraf een verrassing.
      - generic [ref=f2e459]:
        - button "Heb ik hersteltijd nodig?" [ref=f2e460] [cursor=pointer]
        - generic: "Bij een hydrofacial niet: je kunt daarna gewoon de deur uit. Bij microneedling en lip blush is je huid een paar dagen roder en gevoeliger. Je krijgt precies te horen hoeveel dagen je moet inplannen."
      - generic [ref=f2e462]:
        - button "Is het geschikt voor een gevoelige of donkere huid?" [ref=f2e463] [cursor=pointer]
        - generic: Ja, maar de aanpak verschilt. Huidtype, pigmentgevoeligheid en je reactie op eerdere behandelingen bepalen de sterkte en de opbouw van de kuur. Dat is precies waarom de intake er is.
      - generic [ref=f2e465]:
        - button "Wat levert de 3D-huidanalyse op?" [ref=f2e466] [cursor=pointer]
        - generic: Meetwaarden voor pigment, poriën, vochtgehalte, roodheid en fijne lijnen — en voor haardichtheid en haargroei op je hoofdhuid — plus dezelfde scan opnieuw na je kuur. Zo zie je vooruitgang in cijfers, niet alleen in een gevoel. De analyse bepaalt ook welke behandeling je écht nodig hebt.
      - generic [ref=f2e468]:
        - button "In welke taal kan ik terecht?" [ref=f2e469] [cursor=pointer]
        - generic: Nederlands, Arabisch of Engels — wat voor jou het prettigst praat. نتكلم العربية.
